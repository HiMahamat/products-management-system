<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
  <link rel="stylesheet" href="project_css.css">
</head>
<body>
<div class="crud">

  <div class="head">
    <h2>cruds</h2>
    <p>PRODUCT MANAGEMENT SYSTEM</p>
  </div>

  <div class="inputs">
    <input type="text" placeholder="title" id ="title">
        <div class="price">
            <input onkeyup="getTotal()" type="number" placeholder="price" id ="price">
            <input onkeyup="getTotal()" type="number" placeholder="taxes" id ="taxes">
            <input onkeyup="getTotal()" type="number" placeholder="ads" id ="ads">
            <input onkeyup="getTotal()" type="number" placeholder="discount" id ="discount">
            <small  id="total"></small>
        </div>
    <input type="number" placeholder="count" id ="count">
    <input type="text" placeholder="category" id ="category">
    <button id="submit">Create</button>

  </div>

  <div class="outputs">
    <div class="searchBlock">
      <input onkeyup="searchData(this.value)" type="text" placeholder="Search" id ="search">
      <div class="btnSearch">
        <button onclick="getsearchMood(this.id)" id="SearchByTitle">Search By Title</button>
        <button onclick="getsearchMood(this.id)" id="SearchByCategory">Search By Category</button>
      </div>
      <div id="deleteAll"></div>
    </div>

    <table>
      <tr>
        <th>id</th>
        <th>title</th>
        <th>price</th>
        <th>taxes</th>
        <th>ads</th>
        <th>discount</th>
        <th>total</th>
        <th>category</th>
        <th>update</th>
        <th>Delete</th>
      </tr>
      <tbody id="tbody">

      </tbody>
    </table>

  </div>

</div>

<script src="project_main.js"></script>
<section src="project_main"></section>
</body>
</html>
